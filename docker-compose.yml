services:
  # 1. Database MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql_database
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "db_cabai"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. MLflow Tracking Server
  mlflow:
    image: python:3.10-slim
    container_name: mlflow_server
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      sh -c "pip install mlflow pysqlite3 &&
             mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000 --allowed-hosts '*'"

  # 3. FastAPI Backend
  backend:
    build: .
    container_name: fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: "mysql"
      DB_USER: "root"
      DB_PASSWORD: ""
      DB_NAME: "db_cabai"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    volumes:
      - shared_data:/shared
      - ./main.py:/app/main.py
      - ./app:/app/app
      - ./models:/app/models
      - ./scalers:/app/scalers
    depends_on:
      mysql:
        condition: service_healthy

  # 4. BI PIHPS Scraper (jalankan manual: docker compose run --rm scraper)
  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    container_name: pihps_scraper
    restart: "no"
    security_opt:
      - seccomp:unconfined
    shm_size: '2gb'
    privileged: true
    environment:
      DB_HOST: "mysql"
      DB_USER: "root"
      DB_PASSWORD: ""
      DB_NAME: "db_cabai"
    volumes:
      - shared_data:/shared
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started

  # 5. BI PIHPS Scraper Scheduler (otomatis setiap hari 06:00 WIB)
  scraper-scheduler:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    container_name: pihps_scraper_scheduler
    restart: always
    command: ["python", "scraper/scheduler.py"]
    security_opt:
      - seccomp:unconfined
    shm_size: '2gb'
    privileged: true
    environment:
      DB_HOST: "mysql"
      DB_USER: "root"
      DB_PASSWORD: ""
      DB_NAME: "db_cabai"
    volumes:
      - shared_data:/shared
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started

  # 6. Training Scheduler (otomatis setiap Minggu 02:00 WIB)
  trainer-scheduler:
    build: .
    container_name: lstm_trainer_scheduler
    restart: always
    command: ["python", "scripts/train_scheduler.py"]
    environment:
      DB_HOST: "mysql"
      DB_USER: "root"
      DB_PASSWORD: ""
      DB_NAME: "db_cabai"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      TRAIN_ON_STARTUP: "false"   # set "true" untuk training langsung saat container start
    volumes:
      - ./models:/app/models       # weights disimpan langsung ke folder models
      - ./scalers:/app/scalers     # scaler disimpan langsung ke folder scalers
      - mlflow_data:/mlflow
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
      mlflow:
        condition: service_started

volumes:
  db_data:
    driver: local
  mlflow_data:
    driver: local
  shared_data:
    driver: local
